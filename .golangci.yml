version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
  settings:
    misspell:
      locale: UK
      ignore-rules:
        - color
    gosec:
      excludes:
        # File paths come from operator configuration, not from requests.
        - G304
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - onsite-ai
