# Serves the web app and passes API calls to the server over verified HTTPS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://server:8443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /public/ca.pem;
        proxy_ssl_name server;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
