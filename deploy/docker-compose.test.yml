# Throwaway Postgres for `make test`. Data lives in memory and is lost on stop.
name: onsite-test

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: onsite
      POSTGRES_PASSWORD: onsite-test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    command: ["postgres", "-c", "fsync=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onsite"]
      interval: 1s
      timeout: 3s
      retries: 30
